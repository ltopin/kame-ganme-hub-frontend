<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3e2f21"/>
      <stop offset="100%" stop-color="#211a14"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d55a0b" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#cda456" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#cda456" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>

  <!-- Estante: montantes e prateleiras, em tom levemente mais claro que o fundo -->
  <g stroke="#7e6846" stroke-width="6" opacity="0.55" fill="none">
    <line x1="120" y1="140" x2="120" y2="980"/>
    <line x1="420" y1="100" x2="420" y2="980"/>
    <line x1="720" y1="140" x2="720" y2="980"/>
    <line x1="1020" y1="100" x2="1020" y2="980"/>
    <line x1="1320" y1="140" x2="1320" y2="980"/>
    <line x1="1560" y1="100" x2="1560" y2="980"/>

    <line x1="90" y1="330" x2="1590" y2="330"/>
    <line x1="90" y1="560" x2="1590" y2="560"/>
    <line x1="90" y1="790" x2="1590" y2="790"/>
  </g>

  <!-- Caixas e baralhos empilhados nas prateleiras, silhuetas simples -->
  <g opacity="0.5">
    <rect x="150" y="200" width="90" height="118" rx="4" fill="#7e6846"/>
    <rect x="255" y="230" width="70" height="88" rx="4" fill="#a88b5f"/>
    <rect x="460" y="150" width="80" height="168" rx="4" fill="#7e6846"/>
    <rect x="555" y="210" width="60" height="108" rx="4" fill="#a88b5f"/>
    <rect x="760" y="200" width="95" height="118" rx="4" fill="#a88b5f"/>
    <rect x="1060" y="150" width="70" height="168" rx="4" fill="#7e6846"/>
    <rect x="1150" y="220" width="85" height="98" rx="4" fill="#a88b5f"/>
    <rect x="1360" y="200" width="75" height="118" rx="4" fill="#7e6846"/>

    <rect x="160" y="400" width="140" height="70" rx="4" fill="#a88b5f"/>
    <rect x="500" y="380" width="110" height="90" rx="4" fill="#7e6846"/>
    <rect x="800" y="400" width="130" height="70" rx="4" fill="#a88b5f"/>
    <rect x="1100" y="390" width="100" height="80" rx="4" fill="#7e6846"/>
    <rect x="1380" y="400" width="120" height="70" rx="4" fill="#a88b5f"/>

    <rect x="180" y="630" width="160" height="66" rx="4" fill="#7e6846"/>
    <rect x="540" y="620" width="120" height="76" rx="4" fill="#a88b5f"/>
    <rect x="840" y="630" width="140" height="66" rx="4" fill="#7e6846"/>
    <rect x="1150" y="625" width="110" height="72" rx="4" fill="#a88b5f"/>
  </g>

  <!-- Lanternas penduradas, cada uma com brilho suave -->
  <g>
    <circle cx="300" cy="130" r="140" fill="url(#glow)" filter="url(#soft)"/>
    <line x1="300" y1="10" x2="300" y2="55" stroke="#7e6846" stroke-width="4"/>
    <rect x="278" y="55" width="44" height="58" rx="8" fill="#3e2f21" stroke="#cda456" stroke-width="3"/>
    <circle cx="300" cy="84" r="10" fill="#d55a0b"/>

    <circle cx="800" cy="95" r="160" fill="url(#glow)" filter="url(#soft)"/>
    <line x1="800" y1="10" x2="800" y2="60" stroke="#7e6846" stroke-width="4"/>
    <rect x="775" y="60" width="50" height="64" rx="8" fill="#3e2f21" stroke="#cda456" stroke-width="3"/>
    <circle cx="800" cy="92" r="11" fill="#d55a0b"/>

    <circle cx="1300" cy="130" r="140" fill="url(#glow)" filter="url(#soft)"/>
    <line x1="1300" y1="10" x2="1300" y2="55" stroke="#7e6846" stroke-width="4"/>
    <rect x="1278" y="55" width="44" height="58" rx="8" fill="#3e2f21" stroke="#cda456" stroke-width="3"/>
    <circle cx="1300" cy="84" r="10" fill="#d55a0b"/>
  </g>
</svg>
